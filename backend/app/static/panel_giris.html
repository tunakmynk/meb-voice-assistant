<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Giriş</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0F1115; color: #E6E8EE;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  form {
    background: #171A21; padding: 28px; border-radius: 12px;
    width: min(340px, 90vw); box-sizing: border-box;
  }
  h1 { margin: 0 0 4px; font-size: 18px; }
  p  { margin: 0 0 20px; color: #8B93A7; font-size: 13px; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px;
    background: #0F1115; color: #E6E8EE; border: 1px solid #2A303D;
    border-radius: 8px;
  }
  input:focus { outline: 2px solid #4C8DFF; outline-offset: -1px; }
  button {
    width: 100%; margin-top: 12px; padding: 11px; font-size: 15px;
    background: #4C8DFF; color: #0F1115; border: 0; border-radius: 8px;
    font-weight: 600; cursor: pointer;
  }
  .hata { color: #FF6B6B; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
  <form method="post" action="/panel/login">
    <h1>MEB Sesli Asistan</h1>
    <p>Yönetim paneli</p>
    <input type="password" name="sifre" placeholder="Şifre" autofocus required>
    <button type="submit">Giriş</button>
    <div class="hata" id="hata" hidden>Şifre yanlış.</div>
  </form>
<script>
  if (new URLSearchParams(location.search).has('hata')) {
    document.getElementById('hata').hidden = false;
  }
</script>
</body>
</html>
