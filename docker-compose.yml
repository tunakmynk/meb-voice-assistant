# ADR-10: sistem demo dizüstünde çalışır, cihaz yerel ağdan bağlanır.
# Bu dosya yalnızca durum tutan iki servisi ayağa kaldırır (Qdrant + Postgres).
# Backend'i kasıtlı olarak container'a koymuyoruz — geliştirme sırasında
# uvicorn --reload ile yerelde koşacak, iki haftalık sürede her değişiklikte
# image yeniden derlemek kritik yoldan zaman çalar.

services:
  qdrant:
    # Sunucu sürümü, qdrant-client 1.19 ile aynı majör/minör hatta tutuldu.
    image: qdrant/qdrant:v1.19.0
    container_name: meb-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + web UI  -> http://localhost:6333/dashboard
      - "6334:6334"   # gRPC (qdrant-client hızlı yol)
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Qdrant imajında curl/wget yok; kendi binary'si ile TCP kontrolü yapıyoruz.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: meb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meb
      POSTGRES_PASSWORD: meb
      POSTGRES_DB: meb
      # Türkçe metin sıralaması ve tarih formatı için tutarlı locale
      LANG: C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Konteyner ilk kez oluşurken bu dizindeki .sql dosyaları sırayla çalışır.
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meb -d meb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qdrant_storage:
  postgres_data:
